<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APLUS ACHIEVER 运营中心</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#172033;--muted:#718096;--line:#e7ebf0;--blue:#2563eb;--green:#16a34a;--red:#dc2626;--amber:#d97706}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:14px}.logo{font-weight:800;letter-spacing:.5px;color:#1f7a4d;font-size:20px}.brand h1{font-size:20px;margin:0}.brand small{display:block;color:var(--muted);margin-top:3px}
nav{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 14px;background:#eef2f7;color:var(--text);cursor:pointer;font-size:14px}button.primary{background:var(--blue);color:#fff}button.danger{background:#fee2e2;color:#991b1b}
main{max-width:1250px;margin:0 auto;padding:24px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab.active{background:var(--text);color:#fff}
.page{display:none}.page.active{display:block}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.stat b{font-size:27px;display:block;margin:6px 0}.stat span{color:var(--muted);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-top:16px;padding:18px}.panel h2{font-size:16px;margin:0 0 14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.daynav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.daytitle{font-size:20px;font-weight:800;text-align:center}.daytitle small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:3px}.scheduleCards{display:flex;flex-direction:column;gap:10px}.lesson{display:grid;grid-template-columns:90px 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:#fff}.lesson.done{background:#f0fdf4;border-color:#bbf7d0}.lessonTime{font-weight:800;font-size:17px}.lessonMain b{font-size:15px}.lessonMain p{margin:5px 0 0;color:var(--muted);font-size:13px}.lessonAction{min-width:88px}.lessonAction.doneBtn{background:var(--green);color:#fff}.progress{height:7px;background:#edf0f4;border-radius:99px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--blue)}input,select{border:1px solid #d9dee7;border-radius:8px;padding:10px;background:#fff;color:var(--text);min-width:120px}
.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);font-size:14px}.table th{color:var(--muted);font-weight:500}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.course{border:1px solid var(--line);border-radius:12px;padding:14px}.course h3{margin:0 0 8px;font-size:15px}.course p{margin:5px 0;color:var(--muted);font-size:13px}.money{font-weight:700}
.empty{text-align:center;color:var(--muted);padding:35px}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center;z-index:10;padding:18px}.modal.show{display:flex}.box{background:#fff;width:min(720px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:22px}.box h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;color:var(--muted)}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:1fr 1fr}}
@media(max-width:600px){header{padding:14px 16px;align-items:flex-start}.grid,.cards,.form{grid-template-columns:1fr 1fr}main{padding:16px}.table{min-width:760px}.panel{overflow:auto}.lesson{grid-template-columns:72px 1fr}.lessonAction{grid-column:2;width:100%}.daytitle{font-size:16px}}
</style>
</head>
<body>
<header>
<div class="brand"><div class="logo">APLUS ACHIEVER</div><div><h1>运营中心</h1><small>课程 · 排课 · 课时 · 收费 · 老师费用</small></div></div>
<nav><button class="primary" onclick="openCourse()">＋ 新增课程</button><button onclick="openTeacher()">＋ 老师</button><button onclick="openStudent()">＋ 学生</button><button onclick="openSubject()">＋ 科目</button><button onclick="backup()">备份</button><button onclick="restore()">恢复</button></nav>
</header>
<main>
<div class="tabs">
<button class="tab active" data-page="home">运营总览</button><button class="tab" data-page="schedule">排课</button><button class="tab" data-page="students">学生</button><button class="tab" data-page="teachers">老师</button><button class="tab" data-page="subjects">科目</button><button class="tab" data-page="courses">课程</button><button class="tab" data-page="fees">费用</button>
</div>

<section id="home" class="page active">
<div class="grid">
<div class="stat"><span>今日课程</span><b id="sToday">0</b></div><div class="stat"><span>今日已上</span><b id="sDone">0</b></div><div class="stat"><span>今日未上</span><b id="sPending">0</b></div><div class="stat"><span>课时快用完</span><b id="sLow">0</b></div><div class="stat"><span>学生收费</span><b id="sIncome">S$0</b></div><div class="stat"><span>老师费用</span><b id="sTeacher">S$0</b></div>
</div>
<div class="panel"><h2>今日课程</h2><div id="todayList"></div></div>
<div class="panel"><h2>排课冲突</h2><div id="conflicts"></div></div>
</section>

<section id="schedule" class="page"><div class="panel"><div class="daynav"><button onclick="shiftDay(-1)">‹ 前一天</button><div class="daytitle" id="dayTitle">今天<small id="daySub"></small></div><button onclick="shiftDay(1)">后一天 ›</button></div><div class="toolbar"><input type="date" id="filterDate"><button onclick="goToday()">今天</button><button class="primary" onclick="openCourse()">＋ 新增排课</button></div><div id="scheduleCards" class="scheduleCards"></div></div></section>

<section id="students" class="page"><div class="panel"><h2>学生</h2><div class="toolbar"><button class="primary" onclick="openStudent()">＋ 新增学生</button></div><div id="studentList"></div></div></section>

<section id="teachers" class="page"><div class="panel"><h2>老师</h2><div class="toolbar"><button class="primary" onclick="openTeacher()">＋ 新增老师</button></div><div id="teacherList"></div></div></section><section id="subjects" class="page"><div class="panel"><h2>科目</h2><div class="toolbar"><button class="primary" onclick="openSubject()">＋ 新增科目</button></div><div id="subjectList"></div></div></section><section id="courses" class="page"><div class="panel"><h2>课程与课时包</h2><div class="toolbar"><button class="primary" onclick="openCourse()">＋ 新增课程</button></div><div class="cards" id="courseCards"></div></div></section>

<section id="fees" class="page"><div class="panel"><h2>费用</h2><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><span>学生收费</span><b id="fIncome">S$0</b></div><div class="stat"><span>老师费用</span><b id="fTeacher">S$0</b></div><div class="stat"><span>课程差额</span><b id="fMargin">S$0</b></div></div><div style="overflow:auto;margin-top:16px"><table class="table"><thead><tr><th>课程</th><th>学生</th><th>老师</th><th>科目</th><th>课时包</th><th>学生收费</th><th>老师费用</th><th>差额</th></tr></thead><tbody id="feeBody"></tbody></table></div></div></section>
</main>

<div class="modal" id="courseModal"><div class="box"><h2 id="courseModalTitle">新增课程</h2><div class="form">
<div class="field"><label>学生</label><select id="cStu"></select></div>
<div class="field"><label>课程名称</label><input id="cName" placeholder="例如 P5 Mathematics"></div>
<div class="field"><label>老师</label><select id="cTeacher"></select></div>
<div class="field"><label>科目</label><select id="cSubject"></select></div>
<div class="field"><label>Zoom</label><input id="cZoom" placeholder="例如 Zoom 1"></div>
<div class="field"><label>开始日期</label><input type="date" id="cStart"></div>
<div class="field"><label>结束日期</label><input type="date" id="cEnd"></div>
<div class="field full"><label>每周上课日</label><div style="display:flex;gap:12px;flex-wrap:wrap"><label><input type="checkbox" name="weekday" value="1"> 周一</label><label><input type="checkbox" name="weekday" value="2"> 周二</label><label><input type="checkbox" name="weekday" value="3"> 周三</label><label><input type="checkbox" name="weekday" value="4"> 周四</label><label><input type="checkbox" name="weekday" value="5"> 周五</label><label><input type="checkbox" name="weekday" value="6"> 周六</label><label><input type="checkbox" name="weekday" value="0"> 周日</label></div></div>
<div class="field"><label>上课时间</label><input type="time" id="cTime" value="16:00"></div>
<div class="field"><label>结束时间</label><input type="time" id="cEndTime" value="17:30"></div>
<div class="field"><label>课时包</label><input type="number" id="cTotal" min="1" value="10"></div>
<div class="field"><label>学生收费（整个课时包）</label><input type="number" id="cFee" min="0" step=".01" placeholder="500"></div>
<div class="field"><label>老师费用（每节）</label><input type="number" id="cTeacherFee" min="0" step=".01" placeholder="30"></div>
<div class="field full"><label>备注</label><input id="cNote" placeholder="可选"></div>
</div><div class="actions"><button id="deleteCourseBtn" class="danger" style="display:none;margin-right:auto" onclick="deleteCourse()">删除课程</button><button onclick="closeModal('courseModal')">取消</button><button class="primary" onclick="saveCourse()">保存课程</button></div></div></div>

<div class="modal" id="studentModal"><div class="box"><h2 id="studentModalTitle">学生</h2><div class="form"><div class="field full"><label>学生姓名</label><input id="stuName" placeholder="例如 Jason"></div></div><div class="actions"><button onclick="closeModal('studentModal')">取消</button><button class="primary" onclick="saveStudent()">保存</button></div></div></div>

<div class="modal" id="teacherModal"><div class="box"><h2>新增老师</h2><div class="form"><div class="field full"><label>老师姓名</label><input id="teacherName"></div></div><div class="actions"><button onclick="closeModal('teacherModal')">取消</button><button class="primary" onclick="saveTeacher()">保存</button></div></div></div><div class="modal" id="subjectModal"><div class="box"><h2 id="subjectModalTitle">新增科目</h2><div class="form"><div class="field"><label>科目名称</label><input id="subjectName"></div><div class="field"><label>年级 / 层级</label><input id="subjectLevel" placeholder="例如 P5"></div></div><div class="actions"><button onclick="closeModal('subjectModal')">取消</button><button class="primary" onclick="saveSubject()">保存</button></div></div></div><input type="file" id="restoreFile" accept="application/json" style="display:none">

<script>
const KEY='aplus-operation-v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"students":[],"teachers":[],"subjects":[],"courses":[]}');db.teachers=db.teachers||[];db.subjects=db.subjects||[];
let editingCourseId=null;let editingStudentId=null;let editingTeacherId=null;let editingSubjectId=null;
(db.courses||[]).forEach(c=>{c.status=c.status||{};c.dates=c.dates||[];if(c.teacher&&!db.teachers.some(t=>t.id===c.teacher)){let t=db.teachers.find(t=>t.name===c.teacher);if(t)c.teacher=t.id;}});
const $=id=>document.getElementById(id);
const money=n=>'S$'+Number(n||0).toLocaleString('en-SG',{minimumFractionDigits:0,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>new Date().toISOString().slice(0,10);
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}
function datesBetween(a,b,days){let out=[],d=new Date(a+'T00:00:00'),e=new Date(b+'T00:00:00'),want=(days||[]).map(Number);while(d<=e){if(want.includes(d.getDay()))out.push(d.toISOString().slice(0,10));d.setDate(d.getDate()+1)}return out.length?out:[a]}
function sessions(c){return c.dates.map(d=>({date:d,status:c.status[d]||'未上'}))}
function completed(c){return c.dates.filter(d=>c.status[d]==='已上').length}
function remaining(c){return Math.max(0,c.total-completed(c))}
function selectedDate(){return $("filterDate").value||today()}
function shiftDay(n){let d=new Date(selectedDate()+"T00:00:00");d.setDate(d.getDate()+n);$("filterDate").value=d.toISOString().slice(0,10);render()}
function goToday(){$("filterDate").value=today();render()}
function fmtDate(d){let x=new Date(d+"T00:00:00");return x.toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"short"})}
function fillStudents(){$('cStu').innerHTML=db.students.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('')}
function fillTeachers(){$('cTeacher').innerHTML='<option value="">请选择老师</option>'+db.teachers.map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')}
function fillSubjects(){$('cSubject').innerHTML='<option value="">请选择科目</option>'+db.subjects.map(s=>'<option value="'+s.id+'">'+esc(s.name)+(s.level?' · '+esc(s.level):'')+'</option>').join('')}
function teacherName(id){return db.teachers.find(t=>t.id===id)?.name||id||'—'}
function subjectName(id){return db.subjects.find(s=>s.id===id)?.name||id||'—'}
function openTeacher(){editingTeacherId=null;$('teacherName').value='';$('teacherModal').classList.add('show')}
function editTeacher(id){let t=db.teachers.find(x=>x.id===id);if(!t)return;editingTeacherId=id;$('teacherName').value=t.name;$('teacherModal').classList.add('show')}
function deleteTeacher(id){if(db.courses.some(c=>c.teacher===id)){alert('该老师已有课程，不能删除。请先修改或删除相关课程。');return}if(!confirm('确定删除这名老师吗？'))return;db.teachers=db.teachers.filter(t=>t.id!==id);save()}
function saveTeacher(){let n=$('teacherName').value.trim();if(!n)return;if(editingTeacherId){let t=db.teachers.find(x=>x.id===editingTeacherId);if(t)t.name=n}else db.teachers.push({id:uid(),name:n});closeModal('teacherModal');save()}
function openSubject(){editingSubjectId=null;$('subjectModalTitle').textContent='新增科目';$('subjectName').value='';$('subjectLevel').value='';$('subjectModal').classList.add('show')}
function editSubject(id){let s=db.subjects.find(x=>x.id===id);if(!s)return;editingSubjectId=id;$('subjectModalTitle').textContent='修改科目';$('subjectName').value=s.name;$('subjectLevel').value=s.level||'';$('subjectModal').classList.add('show')}
function deleteSubject(id){if(db.courses.some(c=>c.subject===id)){alert('该科目已有课程，不能删除。请先修改或删除相关课程。');return}if(!confirm('确定删除这个科目吗？'))return;db.subjects=db.subjects.filter(s=>s.id!==id);save()}
function saveSubject(){let n=$('subjectName').value.trim(),l=$('subjectLevel').value.trim();if(!n)return;if(editingSubjectId){let s=db.subjects.find(x=>x.id===editingSubjectId);if(s){s.name=n;s.level=l}}else db.subjects.push({id:uid(),name:n,level:l});closeModal('subjectModal');save()}
function renderTeachers(){$('teacherList').innerHTML=db.teachers.length?'<table class="table"><thead><tr><th>老师</th><th>课程</th><th>已上课时</th><th>已产生费用</th><th>操作</th></tr></thead><tbody>'+db.teachers.map(t=>{let cc=db.courses.filter(c=>c.teacher===t.id),done=cc.reduce((a,c)=>a+completed(c),0),cost=cc.reduce((a,c)=>a+c.teacherFee*completed(c),0);return '<tr><td>'+esc(t.name)+'</td><td>'+cc.length+'</td><td>'+done+'</td><td>'+money(cost)+'</td><td><button onclick="editTeacher(\''+t.id+'\')">修改</button> <button class="danger" onclick="deleteTeacher(\''+t.id+'\')">删除</button></td></tr>'}).join('')+'</tbody></table>':'<div class="empty">还没有老师</div>'}
function renderSubjects(){$('subjectList').innerHTML=db.subjects.length?'<table class="table"><thead><tr><th>科目</th><th>年级 / 层级</th><th>课程</th><th>操作</th></tr></thead><tbody>'+db.subjects.map(s=>'<tr><td>'+esc(s.name)+'</td><td>'+esc(s.level||'—')+'</td><td>'+db.courses.filter(c=>c.subject===s.id).length+'</td><td><button onclick="editSubject(\''+s.id+'\')">修改</button> <button class="danger" onclick="deleteSubject(\''+s.id+'\')">删除</button></td></tr>').join('')+'</tbody></table>':'<div class="empty">还没有科目</div>'}
function resetCourseForm(){editingCourseId=null;$('courseModalTitle').textContent='新增课程';$('deleteCourseBtn').style.display='none';$('cName').value='';$('cTeacher').value='';$('cSubject').value='';$('cZoom').value='';$('cStart').value=today();$('cEnd').value=today();$('cTime').value='16:00';$('cEndTime').value='17:30';$('cTotal').value=10;$('cFee').value='';$('cTeacherFee').value='';$('cNote').value='';document.querySelectorAll('input[name="weekday"]').forEach(x=>x.checked=false);document.querySelector('input[name="weekday"][value="'+new Date().getDay()+'"]').checked=true}
function openCourse(){if(!db.students.length){alert('请先新增学生');openStudent();return}if(!db.teachers.length){alert('请先新增老师');openTeacher();return}fillStudents();fillTeachers();fillSubjects();resetCourseForm();$('courseModal').classList.add('show')}
function editCourse(id){let c=db.courses.find(x=>x.id===id);if(!c)return;fillStudents();fillTeachers();fillSubjects();editingCourseId=id;$('courseModalTitle').textContent='修改课程 / 课时包';$('deleteCourseBtn').style.display='block';$('cStu').value=c.stu;$('cName').value=c.name;$('cTeacher').value=c.teacher;$('cSubject').value=c.subject||'';$('cZoom').value=c.zoom||'';$('cStart').value=c.start;$('cEnd').value=c.end;$('cTime').value=c.time;$('cEndTime').value=c.endTime;$('cTotal').value=c.total;$('cFee').value=c.fee;$('cTeacherFee').value=c.teacherFee;$('cNote').value=c.note||'';document.querySelectorAll('input[name="weekday"]').forEach(x=>x.checked=c.days.map(Number).includes(Number(x.value)));$('courseModal').classList.add('show')}
function deleteCourse(){let id=editingCourseId,c=db.courses.find(x=>x.id===id);if(!c)return;let used=completed(c),msg=used?'这门课程已经消耗了 '+used+' 个课时。删除后该课程、排课和费用记录都会移除。确定删除吗？':'确定删除这门课程吗？';if(!confirm(msg))return;db.courses=db.courses.filter(x=>x.id!==id);closeModal('courseModal');save()}
function saveCourse(){
 let stu=$('cStu').value,name=$('cName').value.trim(),teacher=$('cTeacher').value,subject=$('cSubject').value,zoom=$('cZoom').value.trim(),start=$('cStart').value||today(),end=$('cEnd').value||start,time=$('cTime').value,endTime=$('cEndTime').value,total=+($('cTotal').value||1),fee=+($('cFee').value||0),teacherFee=+($('cTeacherFee').value||0);
 let days=[...document.querySelectorAll('input[name="weekday"]:checked')].map(x=>+x.value);if(!days.length)days=[new Date(start+'T00:00:00').getDay()];
 if(!name||!teacher||!subject){alert('请填写课程名称、老师和科目');return}if(end<start){alert('结束日期不能早于开始日期');return}
 let old=editingCourseId?db.courses.find(x=>x.id===editingCourseId):null,used=old?completed(old):0;if(total<used){alert('课时包总课时不能少于已经消耗的 '+used+' 节。');return}
 let ds=datesBetween(start,end,days);if(ds.length>total)ds=ds.slice(0,total);
 let oldStatus=old?old.status||{}:{},status={};ds.forEach(d=>{if(oldStatus[d])status[d]=oldStatus[d]});
 let data={id:old?old.id:uid(),stu,name,teacher,subject,zoom,start,end,days,time,endTime,total,fee,teacherFee,note:$('cNote').value.trim(),dates:ds,status};
 if(old)Object.assign(old,data);else db.courses.push(data);
 closeModal('courseModal');save();
}
function mark(id,date){let c=db.courses.find(x=>x.id===id);if(!c)return;c.status[date]=c.status[date]==='已上'?'未上':'已上';save()}
function allLessons(){return db.courses.flatMap(c=>c.dates.map(date=>({c,date,status:c.status[date]||'未上'})))}
function studentName(id){return db.students.find(s=>s.id===id)?.name||'—'}
function conflicts(){
 let a=allLessons().filter(x=>x.date);
 let out=[];
 for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
  let x=a[i],y=a[j];if(x.date!==y.date)continue;
  let overlap=x.c.time<y.c.endTime&&y.c.time<x.c.endTime;
  if(overlap&&(x.c.stu===y.c.stu||x.c.teacher===y.c.teacher))out.push({x,y,reason:x.c.stu===y.c.stu?'学生时间冲突':'老师时间冲突'});
 }
 return out;
}
function render(){
 let ls=allLessons(),t=today(),tl=ls.filter(x=>x.date===t),done=tl.filter(x=>x.status==='已上').length;
 $('sToday').textContent=tl.length;$('sDone').textContent=done;$('sPending').textContent=tl.length-done;
 $('sLow').textContent=db.courses.filter(c=>remaining(c)<=2).length;
 let inc=db.courses.reduce((a,c)=>a+c.fee,0),tc=db.courses.reduce((a,c)=>a+c.teacherFee*completed(c),0);

function opNormalize(c){
 c.status=c.status||{};c.attendance=c.attendance||{};c.statusRate=c.statusRate||{};
 c.students=Array.isArray(c.students)?c.students:(c.stu?[c.stu]:[]);

 return '<div class="lesson '+(done?'done':'')+'"><div class="lessonTime">'+c.time+'<small style="display:block;color:var(--muted);font-size:12px">'+c.endTime+' 结束</small></div><div class="lessonMain"><b>'+esc(c.name)+'</b><p>'+esc(students)+'　｜　老师：'+esc(teacherName(c.teacher))+'　｜　Zoom：'+esc(c.zoom||'—')+'</p><p>课时包：'+completed(c)+' 已上 / '+remaining(c)+' 剩余 / '+c.total+' 总计</p><div class="progress"><i style="width:'+Math.min(100,Math.round(completed(c)/c.total*100))+'%"></i></div><p style="font-size:12px;color:var(--muted)">老师 Rate：'+(c.teacherRateMode==='tiered'?'按人数':c.teacherRateMode==='manual'?'每节手动':'固定每节')+(done?'　｜　实际 '+att.length+' 人　｜　'+money(rate):'')+'</p><div data-op-att="'+c.id+'-'+date+'" style="display:none"></div></div><div class="actions"><button onclick="opMemberManager(\\''+c.id+'\\')">学生成员</button><button class="lessonAction '+(done?'doneBtn':'primary')+'" onclick="mark(\\''+c.id+'\\',\\''+date+'\\')">'+(done?'✓ 已上':'标记已上')+'</button></div></div>'
}
const opOldConflicts2=conflicts;
conflicts=function(){
 let a=allLessons(),out=[];for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){let x=a[i],y=a[j];if(x.date!==y.date)continue;let overlap=x.c.time<y.c.endTime&&y.c.time<x.c.endTime,xs=opMemberIds(x.c,x.date),ys=opMemberIds(y.c,y.date),same=xs.some(id=>ys.includes(id));if(overlap&&(same||x.c.teacher===y.c.teacher))out.push({x,y,reason:same?'学生时间冲突':'老师时间冲突'})}return out
}
const opOldSaveCourse2=saveCourse;
saveCourse=function(){
 opOldSaveCourse2();
 let c=editingCourseId?db.courses.find(x=>x.id===editingCourseId):db.courses[db.courses.length-1];if(!c)return;
 opNormalize(c);
 if(!c.members.length)c.members=c.students.map(id=>({id,joinDate:c.start||today(),leaveDate:''}));
 c.students=opActiveMembers(c,today()).map(m=>m.id);
 localStorage.setItem(KEY,JSON.stringify(db));render()
}
const opOldEditCourse2=editCourse;
editCourse=function(id){opOldEditCourse2(id);let c=opNormalize(db.courses.find(x=>x.id===id));opMemberList(c);setTimeout(()=>{let b=document.querySelector('#courseModal .actions');if(b&&!b.querySelector('.memberBtn')){let x=document.createElement('button');x.className='memberBtn';x.textContent='学生成员管理';x.onclick=()=>{closeModal('courseModal');opMemberManager(id)};b.insertBefore(x,b.firstChild)}},0)}
render();
